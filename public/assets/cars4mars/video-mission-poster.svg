<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Kopano Labs Cars4Mars video mission poster</title><desc id="d">Abstract Mars horizon with a rover path and play button, used when a video embed is unavailable.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081017"/><stop offset=".55" stop-color="#13202b"/><stop offset="1" stop-color="#30140e"/></linearGradient><radialGradient id="mars"><stop stop-color="#ffb27a"/><stop offset=".4" stop-color="#ff7043"/><stop offset="1" stop-color="#7b2418"/></radialGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="945" cy="170" r="120" fill="url(#mars)" opacity=".9"/><path d="M0 520C190 455 340 470 510 510s338 55 690-28v193H0Z" fill="#0a0e13"/><path d="M120 560c190-30 270-6 380-58 105-49 190-90 340-72" fill="none" stroke="#00e676" stroke-opacity=".38" stroke-width="3" stroke-dasharray="8 12"/><g transform="translate(535 250)"><circle cx="65" cy="65" r="65" fill="#edf4f6" opacity=".94"/><path d="M52 34 95 65 52 96Z" fill="#0d1117"/></g><text x="66" y="84" fill="#f5a623" font-family="monospace" font-size="20" letter-spacing="5">KOPANO LABS × CARS4MARS</text><text x="66" y="132" fill="#edf4f6" font-family="Arial,sans-serif" font-size="38" font-weight="700">WATCH THE EVIDENCE</text><text x="66" y="170" fill="#9fb0bd" font-family="Arial,sans-serif" font-size="22">Video is a host. Mission Control remains the source of truth.</text><text x="66" y="625" fill="#78909d" font-family="monospace" font-size="16">BUILD → TEST → RECORD → PUBLISH</text></svg>