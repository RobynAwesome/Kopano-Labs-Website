name: production-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-surface-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify generated discovery policy is committed
        run: |
          git diff --exit-code -- public/sitemap.xml public/robots.txt
          test -f src/route-manifest.json
          test -f scripts/generate-crawl-policy.mjs
      - name: Verify public metadata and guided crawler policy
        run: |
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/release.json
          test -f public/humans.txt
          grep -q 'User-agent: \*' public/robots.txt
          grep -q 'Allow: /Cars4Mars/' public/robots.txt
          grep -q 'Allow: /proof/' public/robots.txt
          grep -q 'Disallow: /admin/' public/robots.txt
          grep -q 'Disallow: /api/' public/robots.txt
          grep -q 'Sitemap: https://kopanolabs.com/sitemap.xml' public/robots.txt
          grep -q 'RobynAwesome/Kopano-Labs-Website' public/release.json
          grep -q 'retired_repo_is_dependency.*false' public/release.json
      - name: Verify sitemap follows adaptive route registry
        run: |
          grep -q 'https://kopanolabs.com/' public/sitemap.xml
          grep -q 'https://kopanolabs.com/labs/' public/sitemap.xml
          grep -q 'https://kopanolabs.com/systems/' public/sitemap.xml
          grep -q 'https://kopanolabs.com/Cars4Mars/' public/sitemap.xml
          grep -q 'https://kopanolabs.com/proof/' public/sitemap.xml
          first_loc=$(grep -o '<loc>[^<]*' public/sitemap.xml | head -1)
          test "$first_loc" = '<loc>https://kopanolabs.com/Cars4Mars/'
          grep -q '"sitemapOrder": 1' src/route-manifest.json
          grep -q '"id": "cars4mars"' src/route-manifest.json
      - name: Verify human adaptive routing uses same registry
        run: |
          grep -q 'routeForIntent' src/App.tsx
          grep -q 'publicRoutes' src/App.tsx
          grep -q 'What do you want?' src/App.tsx
          grep -q 'route-manifest.json' src/routeRegistry.ts
      - name: Verify implementation priority is explicit
        run: |
          test -f IMPLEMENTATION_ORDER.md
          grep -q 'P5 — Human verification + first-party telemetry' IMPLEMENTATION_ORDER.md
