name: production-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-surface-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

      - name: Verify August execution directive and source boundaries
        run: |
          test -f AGENTS.md
          test -f canonical.md
          test -f now.md
          test -f docs/AUGUST_2026_EXECUTION_DIRECTIVE.md
          test -f public/governance.json
          grep -q 'I_AM_STATELESS_RENTER_NOT_SOURCE_AUTHORITY' AGENTS.md
          grep -q 'Kopano-Labs/Introduction-to-MCP' AGENTS.md
          grep -q 'RobynAwesome/Kopano-Labs-Website' AGENTS.md
          grep -q 'canonical.md' AGENTS.md
          grep -q 'now.md' AGENTS.md
          grep -q 'RobynAwesome/Money-managing-app' AGENTS.md
          grep -q 'RobynAwesome/cars4mars-landingpage' AGENTS.md
          grep -q 'WORKING → CONNECTED → CURRENT → VISIBLE → EVIDENCED → BACKABLE' docs/AUGUST_2026_EXECUTION_DIRECTIVE.md

      - name: Verify canonical production source
        run: |
          node -e "const r=require('./public/release.json'); if(r.canonical_source_repository!=='RobynAwesome/Kopano-Labs-Website') process.exit(1)"
          node -e "const g=require('./public/governance.json'); if(g.canonical_source_repository!=='RobynAwesome/Kopano-Labs-Website') process.exit(1)"
          grep -q 'Canonical GitHub production source' IMPLEMENTATION_ORDER.md
          grep -q 'canonical GitHub production repository' canonical.md

      - name: Verify TypeScript 7 toolchain
        run: |
          node -e "const p=require('./package.json'); const v=p.devDependencies?.typescript||p.dependencies?.typescript; if(!v || !v.includes('7.')) process.exit(1)"
          npx tsc --version | grep -q '^Version 7\.'

      - name: Verify generated discovery policy is committed
        run: |
          git diff --exit-code -- public/sitemap.xml public/robots.txt
          test -f src/route-manifest.json
          test -f scripts/generate-crawl-policy.mjs
          test -f scripts/generate-route-shells.mjs

      - name: Verify public routes and crawler policy
        run: |
          grep -q 'Allow: /Cars4Mars/' public/robots.txt
          grep -q 'Allow: /Cars4Mars/Ledger/' public/robots.txt
          grep -q 'Allow: /Cars4Mars/Architecture/' public/robots.txt
          grep -q 'Allow: /Cars4Mars/Media/' public/robots.txt
          grep -q 'Allow: /Cars4Mars/Support/' public/robots.txt
          grep -q 'Allow: /FOC/' public/robots.txt
          grep -q 'Allow: /content/' public/robots.txt
          ! grep -q 'KOPANO_LABS.pdf' public/robots.txt
          grep -q 'Sitemap: https://kopanolabs.com/sitemap.xml' public/robots.txt
          grep -q 'retired_repo_is_dependency.*false' public/release.json
          grep -q 'money_managing_app_is_dependency.*false' public/release.json

      - name: Verify sitemap follows route registry
        run: |
          for route in Cars4Mars Cars4Mars/Ledger Cars4Mars/Architecture Cars4Mars/Media Cars4Mars/Support FOC systems labs content proof; do grep -q "https://kopanolabs.com/$route/" public/sitemap.xml; done
          ! grep -q 'KOPANO_LABS.pdf' public/sitemap.xml
          grep -q '"id": "foc"' src/route-manifest.json
          grep -q '"id": "cars4mars"' src/route-manifest.json
          grep -q '"id": "content"' src/route-manifest.json

      - name: Verify crawl shells and canonical metadata
        run: |
          for route in Cars4Mars Cars4Mars/Ledger Cars4Mars/Architecture Cars4Mars/Media Cars4Mars/Support FOC systems labs content proof; do test -f "dist/$route/index.html"; done
          grep -q 'rel="canonical" href="https://kopanolabs.com/FOC/"' dist/FOC/index.html
          grep -q 'rel="canonical" href="https://kopanolabs.com/Cars4Mars/"' dist/Cars4Mars/index.html
          grep -q 'rel="canonical" href="https://kopanolabs.com/content/"' dist/content/index.html

      - name: Verify FOC implementation is functional
        run: |
          test -f src/components/FOCMatrix.tsx
          test -f src/foc.css
          grep -q 'FAKE OF CONCEPT' src/components/FOCMatrix.tsx
          grep -q 'FREEDOM OF CONCEPT' src/components/FOCMatrix.tsx
          grep -q 'FiveS Arena' src/components/FOCMatrix.tsx
          grep -q 'KasiLink' src/components/FOCMatrix.tsx
          grep -q 'Cape Campus' src/components/FOCMatrix.tsx
          grep -q 'Starfall Salvage' src/components/FOCMatrix.tsx
          grep -q 'classify(product)' src/components/FOCMatrix.tsx

      - name: Verify current-work visual surface
        run: |
          test -f src/components/RoverVisual.tsx
          test -f src/components/SystemAtlas.tsx
          test -f src/now.css
          grep -q 'Current Kopano Labs work' src/App.tsx
          grep -q 'SystemAtlas' src/App.tsx
          grep -q 'RoverVisual' src/App.tsx
          grep -q 'Falling Walls Lab collaboration page' src/App.tsx
          grep -q 'NICIS founder-in-action page' src/App.tsx

      - name: Verify Cars4Mars stays on-site and evidence honest
        run: |
          grep -q 'DESIGN → PHYSICAL VALIDATION' src/App.tsx
          test -f src/components/Cars4MarsMissionControl.tsx
          grep -q 'THE CHALLENGE · ON THIS PAGE' src/components/Cars4MarsMissionControl.tsx
          grep -q 'Traversal + autonomous perception/navigation' src/components/Cars4MarsMissionControl.tsx
          grep -q 'Hammer · tennis ball · traffic cone' src/components/Cars4MarsMissionControl.tsx
          grep -q 'Black → white → pink → yellow → blue' src/components/Cars4MarsMissionControl.tsx
          ! grep -q '/reports/KOPANO_LABS.pdf' src/components/Cars4MarsMissionControl.tsx
          grep -q '"submission_state": "COMPLETE"' public/release.json
          grep -q '"website_dependency": false' public/release.json

      - name: Verify adaptive runtime still exists
        run: |
          grep -q 'routeForIntent' src/App.tsx
          grep -q 'route-manifest.json' src/routeRegistry.ts
          test -f src/components/KopanoScene.tsx
          test -f src/components/SystemAtlas.tsx
          test -f src/experienceRuntime.ts
          grep -q '@react-three/fiber' package.json
          grep -q 'gsap' package.json
          grep -q 'saveData' src/experienceRuntime.ts
          grep -q 'getExperienceProfile' src/experienceRuntime.ts
          grep -q 'data-experience-tier' src/components/SystemAtlas.tsx

      - name: Verify Search Console baseline is preserved
        run: |
          test -f docs/SEARCH_CONSOLE_BASELINE_2026-08-08.md
          grep -q '53' docs/SEARCH_CONSOLE_BASELINE_2026-08-08.md
          grep -q '1.18K' docs/SEARCH_CONSOLE_BASELINE_2026-08-08.md
